# docker-compose.yml
#
# Runs the whole stack from the repository root:
#   docker compose up --build
#
# Every app image is built from its own Dockerfile in apps/<app>/Dockerfile
# with the repository root as the build context (required for turbo prune).
#
# Infra: PostgreSQL, Redis, RabbitMQ, and nginx as the public web/reverse proxy.

name: nestjs-microservices

# ---------------------------------------------------------------- anchors
# Shared settings for the NestJS microservices (they all talk to the infra below).
x-service: &service
  restart: unless-stopped
  networks: [backend]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  environment: &service-env
    NODE_ENV: production
    PORT: 3000
    # Connection strings for the infra. Update when you actually wire the services up.
    DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
    REDIS_URL: redis://redis:6379
    RABBITMQ_URL: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app}@rabbitmq:5672

# Shared settings for the Next.js frontends.
x-web: &web
  restart: unless-stopped
  networks: [backend]
  environment:
    NODE_ENV: production
    PORT: 3000

services:
  # ---------------------------------------------------------------- infra
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [backend]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [backend]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app}
    ports:
      - "5672:5672"
      - "15672:15672" # management UI -> http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [backend]

  # ---------------------------------------------------------------- microservices
  api-gateway:
    <<: *service
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    ports:
      - "3000:3000" # public entry point (also proxied by nginx at /api)
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  catalog-service:
    <<: *service
    build:
      context: .
      dockerfile: apps/catalog-service/Dockerfile
    expose: ["3000"]

  identity-service:
    <<: *service
    build:
      context: .
      dockerfile: apps/identity-service/Dockerfile
    expose: ["3000"]

  notifications-service:
    <<: *service
    build:
      context: .
      dockerfile: apps/notifications-service/Dockerfile
    expose: ["3000"]

  orders-service:
    <<: *service
    build:
      context: .
      dockerfile: apps/orders-service/Dockerfile
    expose: ["3000"]

  # ---------------------------------------------------------------- frontends
  storefront:
    <<: *web
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    expose: ["3000"]

  admin:
    <<: *web
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    expose: ["3000"]

  # ---------------------------------------------------------------- web server / reverse proxy
  web:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - storefront
      - admin
    restart: unless-stopped
    networks: [backend]

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:

networks:
  backend:
    driver: bridge
