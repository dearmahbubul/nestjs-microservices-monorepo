# docker-compose.yml
#
# Runs the whole stack from the repository root:
#   docker compose up --build
#
# Every app image is built from its own Dockerfile in apps/<app>/Dockerfile
# with the repository root as the build context (required for turbo prune).
#
# Infra: PostgreSQL, MongoDB, Redis, RabbitMQ, and nginx as the public web/reverse proxy.
# Each service owns its own database:
#   identity-service  -> postgres db `identity`
#   orders-service    -> postgres db `orders`
#   catalog-service   -> mongo db `catalog`
#   cart-service      -> mongo db `cart`
# Admin UIs: RabbitMQ management (built into the broker) and Adminer for
# PostgreSQL. Both are development conveniences only.

name: nestjs-microservices

# ---------------------------------------------------------------- anchors
# Shared settings for the NestJS microservices (they all expose GET /health;
# probe it with the bundled Node runtime). Connection strings and depends_on
# are per-service: each one depends only on the infra it actually uses.
x-service: &service
  restart: unless-stopped
  networks: [backend]
  environment: &service-env
    NODE_ENV: production
    PORT: 3000
  healthcheck:
    test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.HEALTHCHECK_PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 20s

# Shared settings for the Next.js frontends.
x-web: &web
  restart: unless-stopped
  networks: [backend]
  environment:
    NODE_ENV: production
    PORT: 3000

services:
  # ---------------------------------------------------------------- infra
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    # Creates the per-service databases on a fresh volume. Skipped on an
    # existing volume (init scripts run only on first boot).
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [backend]

  # Single MongoDB for the two document-shaped services (catalog, cart), each
  # with its own database in the same server.
  mongo:
    image: mongo:7
    # A standalone mongod refuses transactions; the single-node replica set
    # turns them on. catalog-service's stock reservation needs them.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    # Initiates the replica set on first boot; steady state just reports ok.
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }\""]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks: [backend]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [backend]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app}
    # Publishing the broker to the host is for local tooling only: the services
    # reach it over the compose network at rabbitmq:5672 and do not need this.
    # Overridable so a machine that already has 5672/15672 bound by another
    # project can move them instead of failing to start networking.
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672" # management UI -> http://localhost:${RABBITMQ_MGMT_PORT:-15672}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [backend]

  # ---------------------------------------------------------------- admin UIs
  # Single-container PostgreSQL client. Log in with the postgres credentials
  # above (System: PostgreSQL, Server: postgres); they are pre-filled below.
  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_DRIVER: pgsql
    ports:
      - "${ADMINER_PORT:-8080}:8080" # -> http://localhost:${ADMINER_PORT:-8080}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]

  # ---------------------------------------------------------------- microservices
  api-gateway:
    <<: *service
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    # The gateway is the public HTTP surface and listens on 4000 internally
    # (see apps/api-gateway/.env.example), so it does not collide with the
    # internal services all binding 3000 on the shared network.
    environment:
      <<: *service-env
      PORT: 4000
      HEALTHCHECK_PORT: 4000
      # Where to forward each route prefix. These must be the compose service
      # names: the gateway's own fallbacks are localhost:3000, which inside this
      # container is the gateway itself, so every proxied call would 503.
      CATALOG_SERVICE_URL: http://catalog-service:3000
      IDENTITY_SERVICE_URL: http://identity-service:3000
      ORDERS_SERVICE_URL: http://orders-service:3000
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:3000
      CART_SERVICE_URL: http://cart-service:3000
      # Verifies session tokens on protected routes; must match the value
      # identity-service signs with, or every write will 401.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-only-insecure-jwt-secret-change-me}
    ports:
      - "4000:4000" # public entry point (also proxied by nginx at /api)

  # Catalog: MongoDB, one collection for products and one for the reservation
  # ledger. reserveStock runs as a transaction, which is why mongo is gated on
  # the replica set being initiated.
  catalog-service:
    <<: *service
    build:
      context: .
      dockerfile: apps/catalog-service/Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *service-env
      # Shared event exchange; this service's own queue is code-defined, so two
      # subscribers can never collapse onto the same queue.
      MESSAGING_EXCHANGE: orders.events
      RABBITMQ_URL: amqp://app:app@rabbitmq:5672
      MONGODB_URI: mongodb://mongo:27017/catalog?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      # Demo stack: seed sample products on first boot (no-op if not empty).
      SEED_DB: "true"
      SEED_PRODUCTS_COUNT: ${SEED_PRODUCTS_COUNT:-50}
    expose: ["3000"]

  # Cart: MongoDB, one document per customer holding every cart line.
  cart-service:
    <<: *service
    build:
      context: .
      dockerfile: apps/cart-service/Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongo:27017/cart?replicaSet=rs0
    expose: ["3000"]

  identity-service:
    <<: *service
    build:
      context: .
      dockerfile: apps/identity-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/identity
      # Signs the session tokens the gateway verifies. Required in production:
      # the service refuses to boot without it (see its loadConfiguration()).
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-only-insecure-jwt-secret-change-me}
      # Seeds the admin account on first boot. AUTH_ADMIN_PASSWORD is likewise
      # required in production. Change both before exposing this stack.
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL:-admin@example.com}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-admin12345}
      # NODE_ENV=production defaults SEED_DB to false, so seeding must be
      # requested explicitly here or the admin account is never created.
      SEED_DB: "true"
      # There are no migrations, so production also defaults schema syncing off
      # and TypeORM would create no tables ("relation \"users\" does not exist").
      DATABASE_SYNCHRONIZE: "true"
    expose: ["3000"]

  notifications-service:
    <<: *service
    build:
      context: .
      dockerfile: apps/notifications-service/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *service-env
      # Shared event exchange; this service's own queue is code-defined.
      MESSAGING_EXCHANGE: orders.events
      RABBITMQ_URL: amqp://app:app@rabbitmq:5672
    expose: ["3000"]

  orders-service:
    <<: *service
    build:
      context: .
      dockerfile: apps/orders-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *service-env
      # Own postgres database, separate from identity's.
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/orders
      # Publishes order.created to the shared event exchange; it consumes
      # nothing, so it binds no queue.
      MESSAGING_EXCHANGE: orders.events
      RABBITMQ_URL: amqp://app:app@rabbitmq:5672
      # Demo stack: create tables and sample orders on first boot.
      DATABASE_SYNCHRONIZE: "true"
      SEED_DB: "true"
    expose: ["3000"]

  # ---------------------------------------------------------------- frontends
  storefront:
    <<: *web
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      # Everything the browser fetches is same-origin behind nginx, so both
      # public bases are relative. They differ because nginx splits /api:
      #   /api/products*   -> api-gateway (public catalog)
      #   /api/storefront* -> this app (sign in/up, session, cart, order history)
      # NEXT_PUBLIC_* are inlined at build time, so they must be present in the
      # *builder* stage too — see apps/storefront/Dockerfile.
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_APP_BASE: /api/storefront
      # Server-side base URL for the gateway, used by this app's own route
      # handlers (see apps/storefront/app/lib/gateway.ts). It must be the
      # compose service name: the relative bases above resolve, from inside this
      # container, to the storefront itself.
      API_GATEWAY_URL: http://api-gateway:4000
    expose: ["3000"]

  admin:
    <<: *web
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      # The admin app talks to the gateway from its own server-side route
      # handlers (see apps/admin/app/lib/gateway.ts), never from the browser —
      # so this is an in-network address, not a NEXT_PUBLIC_ one.
      API_GATEWAY_URL: http://api-gateway:4000
    expose: ["3000"]

  # ---------------------------------------------------------------- web server / reverse proxy
  web:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - storefront
      - admin
    restart: unless-stopped
    networks: [backend]

volumes:
  postgres-data:
  mongo-data:
  redis-data:
  rabbitmq-data:

networks:
  backend:
    driver: bridge
