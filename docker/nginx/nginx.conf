# nginx reverse proxy for the stack (see docker-compose.yml).
#   /        -> storefront
#   /admin/  -> admin
#   /api/    -> api-gateway
#
# Note: Next.js apps need `basePath: "/admin"` (or "/") in their next.config.ts
# if you serve them under a sub-path.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Docker's embedded DNS. Required for the variable-based proxy_pass below:
  # an `upstream` block resolves its server names once at startup and caches the
  # IP forever, so restarting (or rebuilding) one service leaves nginx pointed at
  # a dead address and every request to that route returns 502 until nginx
  # itself is reloaded. Using a variable forces a fresh lookup per request.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;

    # ---------------------------------------------------------------------
    # Route ordering matters: the storefront owns /api/, so it is matched first.
    #
    # The storefront serves its own Route Handlers under /api/* (sign in, sign
    # up, session, logout, order history). Those have to reach the Next.js app,
    # NOT the gateway — which is also mounted under /api/ for its public
    # catalog. An unanchored `~ ^/api/...` regex below would win over any prefix
    # location and swallow every one of them, so each storefront handler would
    # silently be answered by the gateway instead (sign-in would "succeed" but
    # set no cookie, and every request would leak its body to a second service).
    #
    # Prefix locations are used for the split and the regex is anchored to the
    # single path the gateway actually needs, so the two cannot overlap:
    #   /api/storefront/*  -> storefront handlers (unambiguous, no collision)
    #   /api/products*     -> gateway, public catalog
    #   /api/orders*       -> gateway, anonymous checkout + order list
    # ---------------------------------------------------------------------

    # The storefront's own API. The prefix is kept, because Next mounts these
    # handlers at the literal paths app/api/**/route.ts declares.
    location /api/storefront/ {
      set $storefront_api_upstream http://storefront:3000;
      proxy_pass $storefront_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Regex location so the part after /api/ is captured into $api_path, INCLUDING
    # the first segment: the gateway's route registry keys off the first path
    # segment ('products', 'orders', ...), so '/api/products' must be forwarded
    # as '/products' and '/api/products/:id' as '/products/:id'. A plain prefix
    # location cannot capture; a literal proxy_pass URI would keep the /api
    # prefix. Anchored to the gateway-owned prefixes so it cannot shadow the
    # storefront's handlers above. Products: public catalog reads. Orders:
    # anonymous checkout POST plus the order list.
    location ~ ^/api/(?<api_path>(?:products|orders)(?:/.*)?)$ {
      set $api_upstream http://api-gateway:4000;
      proxy_pass $api_upstream/$api_path$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # admin is a Next.js app with basePath "/admin" (apps/admin/next.config.ts),
    # so the /admin prefix is preserved when proxying (no trailing slash on upstream).
    location /admin {
      set $admin_upstream http://admin:3000;
      proxy_pass $admin_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      set $storefront_upstream http://storefront:3000;
      proxy_pass $storefront_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
