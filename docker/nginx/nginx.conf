# nginx reverse proxy for the stack (see docker-compose.yml).
#   /        -> storefront
#   /admin/  -> admin
#   /api/    -> api-gateway
#
# Note: Next.js apps need `basePath: "/admin"` (or "/") in their next.config.ts
# if you serve them under a sub-path.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  upstream storefront  { server storefront:3000; }
  upstream admin       { server admin:3000; }
  upstream api_gateway { server api-gateway:3000; }

  server {
    listen 80;
    server_name _;

    location /api/ {
      proxy_pass http://api_gateway/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # admin is a Next.js app with basePath "/admin" (apps/admin/next.config.ts),
    # so the /admin prefix is preserved when proxying (no trailing slash on upstream).
    location /admin {
      proxy_pass http://admin;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://storefront/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
