# nginx reverse proxy for the stack (see docker-compose.yml).
#   /        -> storefront
#   /admin/  -> admin
#   /api/    -> api-gateway
#
# Note: Next.js apps need `basePath: "/admin"` (or "/") in their next.config.ts
# if you serve them under a sub-path.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Docker's embedded DNS. Required for the variable-based proxy_pass below:
  # an `upstream` block resolves its server names once at startup and caches the
  # IP forever, so restarting (or rebuilding) one service leaves nginx pointed at
  # a dead address and every request to that route returns 502 until nginx
  # itself is reloaded. Using a variable forces a fresh lookup per request.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;

    # Regex location so the part after /api/ is captured into $1. A plain
    # prefix location cannot capture, and $request_uri would keep the /api
    # prefix the gateway must not see.
    location ~ ^/api/(?<api_path>.*)$ {
      # The gateway's route registry keys off the first path segment
      # ('products', 'orders', ...), not '/api/products', so the /api prefix is
      # stripped here. With a literal proxy_pass URI nginx strips the location
      # prefix itself, but a variable is sent verbatim — hence the named capture.
      set $api_upstream http://api-gateway:4000;
      proxy_pass $api_upstream/$api_path$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # admin is a Next.js app with basePath "/admin" (apps/admin/next.config.ts),
    # so the /admin prefix is preserved when proxying (no trailing slash on upstream).
    location /admin {
      set $admin_upstream http://admin:3000;
      proxy_pass $admin_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      set $storefront_upstream http://storefront:3000;
      proxy_pass $storefront_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
